[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-agents"
version = "0.1.0"
description = "Experiments for predictive agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "Memory_Design/tests", "Reasoning_Architecture/tests", "Reproduction/tests", "Baselines/tests", "Sandbox/tests"]

[tool.setuptools]
packages = []
