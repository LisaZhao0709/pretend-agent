version: "00"
timezone: Asia/Shanghai
forecast_horizon_days: 30
history_windows: 6
window_days: 15
random_seed: 42

paths:
  raw_api_dir: F:\Predictive agents\Data\Raw\APIs\technology_cultivation_00
  interim_dir: F:\Predictive agents\Data\Interim\technology_cultivation_00
  processed_dir: F:\Predictive agents\Data\Processed\technology_cultivation_00
  report_dir: F:\Predictive agents\Data\Reports\technology_cultivation_00

http:
  user_agent: "PredictiveAgentsResearch/00"
  contact_email_env: PROJECT_CONTACT_EMAIL
  timeout_seconds: 15
  max_retries: 1
  min_interval_seconds: 2.0
  backoff_factor_seconds: 3.0
  max_backoff_seconds: 20.0
  max_retry_after_seconds: 60.0
  jitter_seconds: 0.5
  respect_retry_after: true

openalex:
  base_url: https://api.openalex.org/works
  api_key_env: OPENALEX_API_KEY
  per_page: 1
  topics:
    ai_agents:
      label: AI Agents
      query: '"AI agent" OR "AI agents" OR "agentic AI" OR "autonomous agent"'
    large_language_models:
      label: Large Language Models
      query: '"large language model" OR "large language models" OR LLM'
    embodied_intelligence:
      label: Embodied Intelligence
      query: '"embodied intelligence" OR "embodied AI"'
    robotics:
      label: Robotics
      query: robotics OR robot
    quantum_computing:
      label: Quantum Computing
      query: '"quantum computing" OR "quantum computer"'
    metaverse:
      label: Metaverse
      query: metaverse

gdelt:
  base_url: https://api.gdeltproject.org/api/v2/doc/doc
  mode: timelinevolraw
  format: json
  topics:
    ai_agents:
      label: AI Agents
      query: '"AI agent" OR "AI agents" OR "agentic AI" OR "autonomous agent"'
    large_language_models:
      label: Large Language Models
      query: '"large language model" OR "large language models" OR LLM'
    embodied_intelligence:
      label: Embodied Intelligence
      query: '"embodied intelligence" OR "embodied AI"'
    robotics:
      label: Robotics
      query: robotics OR robot
    quantum_computing:
      label: Quantum Computing
      query: '"quantum computing" OR "quantum computer"'
    metaverse:
      label: Metaverse
      query: metaverse

scoring:
  academic_weight: 0.5
  corporate_weight: 0.5
  growth_weight: 0.45
  acceleration_weight: 0.25
  persistence_weight: 0.20
  level_weight: 0.10
